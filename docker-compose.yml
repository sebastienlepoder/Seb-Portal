###############################################################
# LEPODER Portal — Docker Compose
# Deploy: docker compose up -d --build
###############################################################

version: "3.8"

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lepoder-portal
    restart: unless-stopped
    # `expose:` (not `ports:`) — Coolify's Traefik proxy reaches the
    # container on the internal Docker network. Publishing to the host
    # port directly would conflict with Coolify's port management.
    expose:
      - "3000"
    volumes:
      # Persist SQLite database. Default is the Coolify-managed bind path
      # (where this app actually runs). Override with PORTAL_DATA_VOLUME if
      # deploying elsewhere (e.g. PORTAL_DATA_VOLUME=portal-data for a
      # Docker named volume during local dev).
      - ${PORTAL_DATA_VOLUME:-/data/coolify/lepoder-portal}:/app/data
      # Persist generated icons
      - portal-icons:/app/public/icons/generated
      # Config file (editable on host)
      - ./config:/app/config:ro
      # Project documentation files
      - ./projects:/app/projects
      # Update trigger/status files (for self-update feature)
      - ./data:/data
      # Tailscale socket for native integration (optional)
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/portal.db
    healthcheck:
      # /api/health returns 200 for everyone. /api/auth/me returns 401 when
      # unauthenticated, which `wget --spider` reports as a failure and
      # Traefik then refuses to route to the container.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/portal.db
    volumes:
      - ${PORTAL_DATA_VOLUME:-/data/coolify/lepoder-portal}:/app/data
      - portal-icons:/app/public/icons/generated
      - ./config:/app/config:ro
    command: sh -lc "node ./node_modules/prisma/build/index.js db push || npx prisma db push"

  # ─── Agent Dispatch Worker ──────────────────────────────────
  # Polls the Task table, runs headless Claude against cloned repos,
  # commits/pushes/opens PRs. Shares the SQLite database with the portal.
  portal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lepoder-portal-worker
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_started
    volumes:
      # Shared SQLite database (read-write) — same path as the portal so
      # both processes see the same DB. Override via PORTAL_DATA_VOLUME.
      - ${PORTAL_DATA_VOLUME:-/data/coolify/lepoder-portal}:/app/data
      # Persistent clones (so subsequent runs reuse fetches)
      - portal-worker-clones:/app/worker-clones
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/portal.db
      - WORKER_ID=portal-worker-1
      - WORKER_POLL_INTERVAL_MS=5000
      - WORKER_TIMEOUT_MS=300000
      - WORKER_MAX_ITERATIONS=40
      - WORKER_CONCURRENCY=1
      # ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL, GITHUB_TOKEN come from .env
    command: sh -lc "npx tsx worker/index.ts"

volumes:
  # `portal-data` is only used when PORTAL_DATA_VOLUME is set to the literal
  # string "portal-data" (typically for local dev). On Coolify and any other
  # default deploy the bind path is used and this declaration is unused.
  portal-data:
    driver: local
  portal-icons:
    driver: local
  portal-worker-clones:
    driver: local

# No top-level `networks:` — let Coolify (or `docker compose`) attach
# services to its default network. On Coolify this puts the portal on the
# `coolify` proxy network so Traefik can route to it.