###############################################################
# LEPODER Portal — Docker Compose
# Deploy: docker compose up -d --build
###############################################################

version: "3.8"

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lepoder-portal
    restart: unless-stopped
    # `expose:` (not `ports:`) — Coolify's Traefik proxy reaches the
    # container on the internal Docker network. Publishing to the host
    # port directly would conflict with Coolify's port management.
    expose:
      - "3000"
    volumes:
      # Persist SQLite database. Default is the Coolify-managed bind path
      # (where this app actually runs). Override with PORTAL_DATA_VOLUME if
      # deploying elsewhere (e.g. PORTAL_DATA_VOLUME=portal-data for a
      # Docker named volume during local dev).
      - ${PORTAL_DATA_VOLUME:-/data/coolify/lepoder-portal}:/app/data
      # Persist generated icons
      - portal-icons:/app/public/icons/generated
      # Config file (editable on host)
      - ./config:/app/config:ro
      # Project documentation files
      - ./projects:/app/projects
      # Update trigger/status files (for self-update feature)
      - ./data:/data
      # Tailscale socket for native integration (optional)
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/portal.db
    networks:
      # `default` keeps the portal on the per-app compose network for talking
      # to portal-worker. `coolify` is the external proxy network where
      # Traefik runs — without this, Traefik has no path to the container
      # and you get "no available server" even with correct routing labels.
      - default
      - coolify
    healthcheck:
      # /api/health returns 200 for everyone (auth/me returns 401 → wget fail
      # → Traefik thinks the container is unhealthy).
      # 127.0.0.1, NOT localhost — `localhost` resolves to ::1 (IPv6) in
      # this container but next-server only listens on 0.0.0.0:3000 (IPv4),
      # so the wget connection gets refused.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    networks:
      - default
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/portal.db
    volumes:
      - ${PORTAL_DATA_VOLUME:-/data/coolify/lepoder-portal}:/app/data
      - portal-icons:/app/public/icons/generated
      - ./config:/app/config:ro
    command: sh -lc "node ./node_modules/prisma/build/index.js db push || npx prisma db push"

  # ─── Agent Dispatch Worker ──────────────────────────────────
  # Polls the Task table, runs headless Claude against cloned repos,
  # commits/pushes/opens PRs. Shares the SQLite database with the portal.
  portal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lepoder-portal-worker
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_started
    # Give the worker up to 10 minutes after SIGTERM to drain in-flight
    # tasks before Docker SIGKILLs it. The worker's main loop (see
    # worker/index.ts) sets `shuttingDown=true` on SIGTERM, stops picking
    # up new tasks, and waits for inFlight to reach 0. Without this
    # override, Docker's default 10s grace period would kill the worker
    # mid-task on every Coolify redeploy — most acutely when the
    # "Merge to main automatically" checkbox triggers the redeploy itself.
    # Tasks still running after 10m get killed (their DB rows are reaped
    # as stale after 2× WORKER_TIMEOUT_MS).
    stop_grace_period: 10m
    networks:
      - default
    volumes:
      # Shared SQLite database (read-write) — same path as the portal so
      # both processes see the same DB. Override via PORTAL_DATA_VOLUME.
      - ${PORTAL_DATA_VOLUME:-/data/coolify/lepoder-portal}:/app/data
      # Persistent clones (so subsequent runs reuse fetches)
      - portal-worker-clones:/app/worker-clones
      # Claude Agent SDK reads $HOME/.claude/.credentials.json (populated by
      # `claude login` on a host with a browser). Bootstrap once and the
      # worker uses your Max subscription instead of paying API tokens.
      # Override the host side via CLAUDE_CREDS_DIR.
      - ${CLAUDE_CREDS_DIR:-/data/coolify/lepoder-portal/claude-creds}:/home/nextjs/.claude:ro
    env_file:
      - .env
    environment:
      # DATABASE_URL must point at the shared portal-data bind. Hardcoded
      # because it's tied to the compose volume mount above.
      - DATABASE_URL=file:/app/data/portal.db
      # All tunables fall through to .env (Coolify-managed env vars). The
      # worker code provides sensible defaults via process.env.X || 'N',
      # so anything that's not set in .env still works. Do NOT hardcode
      # these here — that would mask user overrides because compose's
      # `environment:` overrides `env_file:`.
      #   WORKER_ID                  — unique id (default hostname-pid)
      #   WORKER_POLL_INTERVAL_MS    — default 5000
      #   WORKER_TIMEOUT_MS          — default 300000 (5 min) per-task hard cap
      #   WORKER_MAX_TURNS           — default 100 (Claude Agent SDK turn budget)
      #   WORKER_CONCURRENCY         — default 1 simultaneous task
      #   WORKER_DEFAULT_MODEL       — default claude-sonnet-4-6
      #   WORKER_NPM_INSTALL_TIMEOUT_MS — default 300000
      #   WORKER_SKIP_NPM_INSTALL    — default false
      #   MAESTRO_TIMEOUT_MS         — default 4 × WORKER_TIMEOUT_MS
      #   MAESTRO_MAX_TURNS          — default 60
      #   MAESTRO_MAX_SUBTASKS       — default 5
      #   GITHUB_TOKEN               — PAT for clone/push
      #   ANTHROPIC_API_KEY          — only used as fallback when no Max OAuth
      #                                credentials are mounted at /home/nextjs/.claude
    command: sh -lc "npx tsx worker/index.ts"

volumes:
  # `portal-data` is only used when PORTAL_DATA_VOLUME is set to the literal
  # string "portal-data" (typically for local dev). On Coolify and any other
  # default deploy the bind path is used and this declaration is unused.
  portal-data:
    driver: local
  portal-icons:
    driver: local
  portal-worker-clones:
    driver: local

networks:
  # `default` is auto-created per project (Coolify renames it to its
  # per-app network like pwk4...) — services use this to talk to each other.
  # `coolify` is the external Traefik proxy network. The portal joins both
  # so Traefik can route inbound traffic to it. Worker stays on default
  # only — it doesn't serve HTTP, just polls the shared SQLite DB.
  coolify:
    external: true