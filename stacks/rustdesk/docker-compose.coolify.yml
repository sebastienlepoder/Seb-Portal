services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - rustdesk-data:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - rustdesk-data:/root
    ports:
      - "21117:21117"
      - "21119:21119"
    depends_on:
      - hbbs
    restart: unless-stopped

volumes:
  rustdesk-data:
